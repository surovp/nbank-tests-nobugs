name: NBank regression

on:
  push:
    branches: [ main, regression-in-pipeline ]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - 'infra/docker-compose/**'
      - '.github/workflows/nbank-regression.yml'

  pull_request:
    paths:
      - 'src/**'
      - 'requirements.txt'
      - 'infra/docker-compose/**'
      - '.github/workflows/nbank-regression.yml'

  workflow_dispatch:
    inputs:
      api_version:
        description: "Backend version tag (matches @pytest.mark.api_version(..))"
        # Указывает, обязателен ли параметр ручного запуска.
        required: true # Указывает, обязателен ли параметр ручного запуска.
        type: choice
        options:
          - with_database
          - with_fraud_check
          - with_database_with_fix_with_swagger
        default: with_database_with_fix_with_swagger
      backend_tag:
        description: "Docker image tag for backend"
        required: true
        type: string
        # Значение по умолчанию, если пользователь ничего не поменял.
        default: with_database_with_fix_with_swagger

env:
  PYTHON_VERSION: "3.13"
  API_VERSION_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.api_version || 'with_database_with_fix_with_swagger' }}
  BACKEND_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.backend_tag || 'with_database_with_fix_with_swagger' }}
  UI_BASE_URL: http://localhost:3000
  DB_HOST: localhost
  SWAGGER_COVERAGE_CONFIG_FILE_YAML: ./.github/swagger_coverage_config.yaml

jobs:
  code-quality:
    name: Code Style flake8
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run flake8
        run: flake8 src/

  api-regression:
    name: NBank API regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: code-quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start services
        # Shell-команды, которые выполняются на runner.
        run: |
          export NBANK_BACKEND_IMAGE="nobugsme/nbank:${BACKEND_TAG}"
          echo "Using image: $NBANK_BACKEND_IMAGE"
          docker compose -f infra/docker-compose/docker-compose.yaml up -d
          for i in {1..60}; do
            if curl -sf http://localhost:4111/actuator/health >/dev/null; then
              echo "Backend is UP"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:4111/actuator/health

      - name: Run API tests
        run: |
          pytest -o addopts="" \
            -m api \
            --api-version "$API_VERSION_INPUT" \
            --alluredir=allure-results \
            -vv

      - name: Generate Swagger Coverage Report
        if: always()
        run: |
          mkdir -p swagger-coverage coverage-results
          swagger-coverage-tool save-report

      - name: Check API Coverage
        if: always()
        run: |
          python - <<'PY'
          import json
          import sys

          required = 50
          with open("swagger-coverage/coverage-report.json", encoding="utf-8") as report:
              data = json.load(report)

          coverage = data["servicesCoverage"]["nbank-api"]["totalCoverage"]
          print(f"API Coverage: {coverage}%")
          print(f"Required: {required}%")

          if coverage < required:
              print(f"API Coverage is below {required}%")
              sys.exit(1)

          print("API Coverage check passed")          
          PY

      - name: Upload API Allure results
        if: always()
        # Подключение готового GitHub Action.
        uses: actions/upload-artifact@v4
        with:
          # Название workflow или step, которое будет видно в GitHub Actions.
          name: allure-results-api
          # Путь к файлам или папке для cache/artifact/action.
          path: allure-results
          # Поведение artifact upload, если файлов нет.
          if-no-files-found: ignore

      - name: Upload Swagger Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Название workflow или step, которое будет видно в GitHub Actions.
          name: swagger-coverage
          # Путь к файлам или папке для cache/artifact/action.
          path: swagger-coverage
          # Поведение artifact upload, если файлов нет.
          if-no-files-found: ignore

      - name: Upload Coverage Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results-raw
          path: coverage-results
          if-no-files-found: ignore

      - name: Shutdown services
        if: always()
        run: docker compose -f infra/docker-compose/docker-compose.yaml down

  ui-regression:
    name: NBank UI · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Кэшируем Playwright браузеры.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ matrix.browser }}-  

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps ${{ matrix.browser }}

      - name: Start services
        run: |
          export NBANK_BACKEND_IMAGE="nobugsme/nbank:${BACKEND_TAG}"
          echo "Using image: $NBANK_BACKEND_IMAGE"
          docker compose -f infra/docker-compose/docker-compose.yaml up -d
          for i in {1..60}; do
            if curl -sf http://localhost:4111/actuator/health >/dev/null; then
              echo "Backend is UP"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:4111/actuator/health

      - name: Run UI tests
        run: |
          pytest -o addopts="" \
            -m ui \
            --browser "${{ matrix.browser }}" \
            --alluredir=allure-results \
            -vv

      - name: Upload UI Allure results
        # Условие выполнения step или job.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui-${{ matrix.browser }}
          # Путь к файлам или папке для cache/artifact/action.
          path: allure-results
          # Поведение artifact upload, если файлов нет.
          if-no-files-found: ignore

      - name: Shutdown services
        if: always()
        run: docker compose -f infra/docker-compose/docker-compose.yaml down

  nbank-regression:
    name: NBank regression success
    runs-on: ubuntu-latest
    # Зависимости job: эта job ждёт завершения указанных jobs.
    needs: [api-regression, ui-regression]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check regression result
        run: |
          echo "API regression: ${{ needs.api-regression.result }}"
          echo "UI regression: ${{ needs.ui-regression.result }}"

          if [ "${{ needs.api-regression.result }}" != "success" ]; then
            exit 1
          fi

          if [ "${{ needs.ui-regression.result }}" != "success" ]; then
            exit 1
          fi

  # Публикация аллюр отчета
  publish-allure-report-page:
    name: Publish Allure report page
    runs-on: ubuntu-latest
    needs: [api-regression, ui-regression, nbank-regression]
    if: always()
    # Максимальное время выполнения job, чтобы не зависнуть навсегда.
    timeout-minutes: 10

    steps:
      # Элемент списка для текущего блока YAML.
      - uses: actions/checkout@v4

      - name: Download Allure results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Download Swagger Coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          # Название workflow или step, которое будет видно в GitHub Actions.
          name: swagger-coverage
          # Путь к файлам или папке для cache/artifact/action.
          path: swagger-coverage

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        # Позволяет продолжить workflow, даже если этот step упал.
        continue-on-error: true
        with:
          # Git ref или branch, который нужно checkout-нуть.
          ref: gh-pages
          # Путь к файлам или папке для cache/artifact/action.
          path: gh-pages

        # Установка утилиты для генерации графического отчета
      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Generate Allure report
        run: |
          if compgen -G "allure-results/*" > /dev/null; then
            allure generate allure-results --clean -o allure-report
          else
            mkdir -p allure-report
            cat > allure-report/index.html <<'HTML'
          <!doctype html>
          <html>
            <head><meta charset="utf-8"><title>Allure Report</title></head>
            <body><h1>No Allure results were generated</h1></body>
          </html>
          HTML
          fi

      - name: Prepare GitHub Pages structure
        run: |
          RUN=${{ github.run_number }}
          mkdir -p gh-pages/nbank-regression/$RUN/allure-report
          cp -R allure-report/. gh-pages/nbank-regression/$RUN/allure-report/

          if [ -d swagger-coverage ]; then
            mkdir -p gh-pages/nbank-regression/$RUN/swagger-coverage
            cp -R swagger-coverage/. gh-pages/nbank-regression/$RUN/swagger-coverage/
          fi

      - name: Verify Allure report
        run: test -f gh-pages/nbank-regression/${{ github.run_number }}/allure-report/index.html

      - name: Deploy reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Токен GitHub Actions для записи в репозиторий.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Ветка, куда публикуется статический сайт GitHub Pages.
          publish_branch: gh-pages
          # Локальная папка, содержимое которой будет опубликовано.
          publish_dir: gh-pages
          # Сохраняет уже опубликованные отчёты в gh-pages.
          keep_files: true
          # Создаёт чистую историю публикации для gh-pages.
          force_orphan: true

      - name: Publish report URL
        if: always()
        run: |
          ALLURE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/nbank-regression/${{ github.run_number }}/allure-report/"
          SWAGGER_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/nbank-regression/${{ github.run_number }}/swagger-coverage/"

          echo "### NBank Regression Reports" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Allure Report:** ${ALLURE_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Swagger Coverage:** ${SWAGGER_URL}" >> "$GITHUB_STEP_SUMMARY"

  notify-telegram:
    name: Send Telegram notification
    runs-on: ubuntu-latest
    needs: [ api-regression, ui-regression, publish-allure-report-page ]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_RESULT: ${{ needs.api-regression.result }}
          UI_RESULT: ${{ needs.ui-regression.result }}
          RUN_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"

          ALLURE_URL="https://${OWNER}.github.io/${REPO_NAME}/nbank-regression/${RUN_NUMBER}/allure-report/"
          SWAGGER_URL="https://${OWNER}.github.io/${REPO_NAME}/nbank-regression/${RUN_NUMBER}/swagger-coverage/"

          # Эмодзи статуса
          if [ "${API_RESULT}" = "success" ]; then API_ICON="✅"; else API_ICON="❌"; fi
          if [ "${UI_RESULT}" = "success" ]; then UI_ICON="✅"; else UI_ICON="❌"; fi

          if [ "${API_RESULT}" = "success" ] && [ "${UI_RESULT}" = "success" ]; then
            HEADER="🎉 <b>NBank Regression — PASSED</b>"
          else
            HEADER="🚨 <b>NBank Regression — FAILED</b>"
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"

          MESSAGE="${HEADER}

          <b>Run:</b> #${RUN_NUMBER}
          <b>Repo:</b> ${REPO}
          <b>Branch:</b> ${BRANCH}
          <b>Commit:</b> <code>${SHORT_SHA}</code>
          <b>Author:</b> ${ACTOR}

          <b>Results:</b>
          ${API_ICON} API regression: <b>${API_RESULT}</b>
          ${UI_ICON} UI regression: <b>${UI_RESULT}</b>

          <b>Reports:</b>
          📊 <a href=\"${ALLURE_URL}\">Allure Report</a>
          📈 <a href=\"${SWAGGER_URL}\">Swagger Coverage</a>

          🔗 <a href=\"${RUN_URL}\">GitHub Actions run</a>"

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${MESSAGE}"