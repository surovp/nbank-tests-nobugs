name: Run tests

on:
  workflow_dispatch:
    inputs:
      api_version:
        description: 'Backend version tag (matches @pytest.mark.api_version(...))'
        required: true
        type: choice
        options:
          - with_database
          - with_fraud_check
          - with_database_with_fix_with_swagger
      suite:
        description: "Какой съют запускать"
        required: true
        type: choice
        options:
          - api
          - ui
          - api+ui
      markers:
        description: "пайтест маркеры"
        required: false
        default: ""
      backend_tag:
        description: "Docker image tag for backend"
        required: true
        type: string
        default: "with_database_with_fix_with_swagger"
  push:
    branches: [main, master, nbank-ci-cd]
    paths:
      - 'src/**'

env:
  TEST_IMAGE: python-tests:with-stab-tests
  DOCKERHUB_REPO: pavels174/pavels-rep
  NETWORK_NAME: docker-compose_nbank-network
  PYTHON_VERSION: "3.13"

jobs:
  # lint — блокирующий шаг, если CodeStyle не пройден, дальше не идем
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8 on src/
        run: flake8 src/

  # test — поднимает compose, собирает образ, запускает тесты в контейнере
  test:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build test image
        run: docker build -t ${{ env.TEST_IMAGE }} .

      - name: Start services
        env:
          BACKEND_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.backend_tag || 'with_database_with_fix_with_swagger' }}
        run: |
          # Переопределяем версию backend из inputs (или дефолт) — приоритет над .env.versions
          export NBANK_BACKEND_IMAGE="nobugsme/nbank:${BACKEND_TAG}"

          docker compose \
            --env-file .env.versions \
            -f infra/docker-compose/docker-compose.yaml \
            up -d

          for i in {1..60}; do
            if curl -sf http://localhost:4111/actuator/health >/dev/null; then
              echo "✅ Backend is UP"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:4111/actuator/health

      - name: Run tests in container
        env:
          API_VERSION_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.api_version || 'with_database_with_fix_with_swagger' }}
          SUITE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'api+ui' }}
          MARKERS_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.markers || '' }}
        run: |
          set -eux

          API_VERSION_INPUT="${API_VERSION_INPUT:-with_database_with_fix_with_swagger}"
          SUITE_INPUT="${SUITE_INPUT:-api+ui}"
          MARKERS="${MARKERS_INPUT:-}"

          M_OPT=""
          if [ -n "$MARKERS" ]; then
            M_OPT="-m $MARKERS"
          fi

          if [ "$SUITE_INPUT" = "api" ]; then
            echo "▶️  Запускаем API-тесты"
            docker run --rm \
              --name fraud-mock \
              --network ${{ env.NETWORK_NAME }} \
              -p 8080:8080 \
              --env-file .env.ci \
              ${{ env.TEST_IMAGE }} \
              pytest -m api --api-version "$API_VERSION_INPUT" $M_OPT -q

          elif [ "$SUITE_INPUT" = "ui" ]; then
            echo "▶️  Запускаем UI-тесты"
            docker run --rm \
              --network ${{ env.NETWORK_NAME }} \
              -p 8080:8080 \
              --env-file .env.ci \
              ${{ env.TEST_IMAGE }} \
              pytest -m ui $M_OPT -q

          elif [ "$SUITE_INPUT" = "api+ui" ]; then
            echo "▶️  Запускаем API-тесты, затем UI-тесты"
            docker run --rm \
              --name fraud-mock \
              --network ${{ env.NETWORK_NAME }} \
              -p 8080:8080 \
              --env-file .env.ci \
              ${{ env.TEST_IMAGE }} \
              pytest -m api --api-version "$API_VERSION_INPUT" $M_OPT -q

            docker run --rm \
              --network ${{ env.NETWORK_NAME }} \
              -p 8080:8080 \
              --env-file .env.ci \
              ${{ env.TEST_IMAGE }} \
              pytest -m ui $M_OPT -q

          else
            echo "❌ Неизвестный suite: '$SUITE_INPUT'"
            echo "   Ожидается одно из: api | ui | api+ui"
            exit 1
          fi

      - name: Shutdown
        if: always()
        run: |
          docker compose \
            --env-file .env.versions \
            -f infra/docker-compose/docker-compose.yaml \
            down -v

  # push — собирает образ с тегом = short SHA и пушит в Docker Hub, запускается только при push, только после успешных тестов
  push:
    needs: [test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build test image with commit-hash tag
        run: docker build -t ${{ env.DOCKERHUB_REPO }}:${{ steps.vars.outputs.short_sha }} .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}   # ← Repository secrets in GitHub
          password: ${{ secrets.DOCKERHUB_TOKEN }}      # ← Repository secrets in GitHub

      - name: Push to Docker Hub
        run: docker push ${{ env.DOCKERHUB_REPO }}:${{ steps.vars.outputs.short_sha }}

      - name: Summary
        run: |
          echo "### Образ опубликован" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`docker pull ${{ env.DOCKERHUB_REPO }}:${{ steps.vars.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY